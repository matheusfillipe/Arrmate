# Arrmate — compose.ollama-amd.yaml
#
# AMD GPU (ROCm) override for Ollama. Merge via COMPOSE_FILE in .env:
#   COMPOSE_FILE=compose.yaml:compose.ollama-amd.yaml
#   (or use compose.prod.yaml / compose.full.yaml as the base)
#
# REQUIREMENTS:
#   - AMD GPU with ROCm support (RX 5000 series or newer recommended)
#   - ROCm drivers on the host
#     https://rocm.docs.amd.com/en/latest/deploy/linux/index.html
#   - Host kernel with HSA/KFD support (/dev/kfd must exist)
#
# SUPPORTED GPUS:
#   gfx906 (Radeon VII), gfx908 (MI100), gfx90a (MI200),
#   gfx1030 (RX 6800+), gfx1100 (RX 7900 series)
#
# VERIFY GPU ACCESS:
#   docker run --rm --device /dev/kfd --device /dev/dri \
#     rocm/rocm-terminal rocminfo | grep gfx

services:
  ollama:
    image: ollama/ollama:rocm
    devices:
      - /dev/kfd # Kernel Fusion Driver (required for ROCm)
      - /dev/dri # Direct Rendering Infrastructure
    group_add:
      - video
      - render
