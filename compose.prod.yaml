# Arrmate — compose.prod.yaml (pre-built image)
#
# Default image is the upstream Docker Hub build. This repo's CI publishes
# to ghcr.io/<owner>/arrmate; point ARRMATE_IMAGE at it in .env:
#   ARRMATE_IMAGE=ghcr.io/<owner>/arrmate:latest
#
# USAGE:
#   cp .env.example .env && nano .env
#   docker compose -f compose.prod.yaml up -d
# Or set in .env:
#   COMPOSE_FILE=compose.prod.yaml
#
# GPU ACCELERATION FOR OLLAMA (merge an override):
#   COMPOSE_FILE=compose.prod.yaml:compose.ollama-nvidia.yaml
#   COMPOSE_FILE=compose.prod.yaml:compose.ollama-amd.yaml

x-arrmate-image: &arrmate-image ${ARRMATE_IMAGE:-techbutton/arrmate:latest}

x-arrmate-env: &arrmate-env
  API_HOST: 0.0.0.0
  API_PORT: ${API_PORT:-8000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
  SONARR_URL: ${SONARR_URL:-}
  SONARR_API_KEY: ${SONARR_API_KEY:-}
  RADARR_URL: ${RADARR_URL:-}
  RADARR_API_KEY: ${RADARR_API_KEY:-}
  LIDARR_URL: ${LIDARR_URL:-}
  LIDARR_API_KEY: ${LIDARR_API_KEY:-}
  BAZARR_URL: ${BAZARR_URL:-}
  BAZARR_API_KEY: ${BAZARR_API_KEY:-}
  AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-}
  AUDIOBOOKSHELF_API_KEY: ${AUDIOBOOKSHELF_API_KEY:-}
  LAZYLIBRARIAN_URL: ${LAZYLIBRARIAN_URL:-}
  LAZYLIBRARIAN_API_KEY: ${LAZYLIBRARIAN_API_KEY:-}
  READMEABOOK_URL: ${READMEABOOK_URL:-}
  READMEABOOK_API_KEY: ${READMEABOOK_API_KEY:-}
  READARR_URL: ${READARR_URL:-}
  READARR_API_KEY: ${READARR_API_KEY:-}
  PLEX_URL: ${PLEX_URL:-}
  PLEX_TOKEN: ${PLEX_TOKEN:-}
  SECRET_KEY: ${SECRET_KEY:-}
  AUTH_DATA_DIR: /data
  SABNZBD_URL: ${SABNZBD_URL:-}
  SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
  NZBGET_URL: ${NZBGET_URL:-}
  NZBGET_USERNAME: ${NZBGET_USERNAME:-}
  NZBGET_PASSWORD: ${NZBGET_PASSWORD:-}
  QBITTORRENT_URL: ${QBITTORRENT_URL:-}
  QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
  QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
  TRANSMISSION_URL: ${TRANSMISSION_URL:-}
  TRANSMISSION_USERNAME: ${TRANSMISSION_USERNAME:-}
  TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD:-}
  TRANSCODE_CRF: ${TRANSCODE_CRF:-28}
  TRANSCODE_PRESET: ${TRANSCODE_PRESET:-medium}

services:
  # Runs once before the app: fixes /data ownership left by pre-v2.0.0
  # images that ran as root (users.db, services.json, ...).
  arrmate-init:
    image: *arrmate-image
    pull_policy: always
    volumes:
      - arrmate-data:/data
    entrypoint:
      - /bin/sh
      - -c
      - "chown -R arrmate:arrmate /data && echo 'arrmate: /data ownership verified'"
    user: root
    restart: "no"
    networks:
      - arrmate-net

  arrmate:
    image: *arrmate-image
    container_name: arrmate
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *arrmate-env
    volumes:
      - arrmate-data:/data
      # - /your/movies:/movies
      # - /your/tv:/tv
    networks:
      - arrmate-net
      # - traefik
    depends_on:
      arrmate-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get('http://localhost:8000/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.arrmate.rule: Host(`${TRAEFIK_DOMAIN}`)
    #   traefik.http.routers.arrmate.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
    #   traefik.http.routers.arrmate.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
    #   traefik.http.services.arrmate.loadbalancer.server.port: "8000"
    #   traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}

  ollama:
    image: ollama/ollama:latest
    container_name: arrmate-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - arrmate-net
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  arrmate-net:
    name: arrmate-net
  # traefik:
  #   external: true
  #   name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  arrmate-data:
    driver: local
  ollama-data:
    driver: local
