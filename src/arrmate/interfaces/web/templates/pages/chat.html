{% extends "base.html" %}

{% block title %}Chat — Arrmate{% endblock %}

{% block content %}
<div x-data="chat()" x-init="init()" class="flex gap-4 h-[calc(100vh-8rem)]">

  <!-- Thread sidebar -->
  <aside class="w-64 flex-shrink-0 hidden lg:flex flex-col bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
    <div class="p-3 border-b border-gray-700">
      <button @click="newThread()"
              class="w-full px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition-colors">
        + New chat
      </button>
    </div>
    <div class="flex-1 overflow-y-auto p-2 space-y-1">
      <template x-for="t in threads" :key="t.id">
        <div class="group flex items-center rounded-lg hover:bg-gray-700"
             :class="t.id === threadId ? 'bg-gray-700' : ''">
          <a :href="'/web/chat/' + t.id" class="flex-1 px-3 py-2 text-sm text-gray-300 truncate"
             x-text="t.title"></a>
          <button @click="deleteThread(t.id)"
                  class="px-2 py-1 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"
                  title="Delete">✕</button>
        </div>
      </template>
    </div>
  </aside>

  <!-- Chat pane -->
  <section class="flex-1 flex flex-col bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
    <div id="chat-scroll" class="flex-1 overflow-y-auto p-4 space-y-4">
      <template x-for="(m, i) in messages" :key="i">
        <div>
          <div class="flex" :class="m.role === 'user' ? 'justify-end' : 'justify-start'">
            <div class="max-w-[85%] rounded-xl px-4 py-2.5 text-sm"
                 :class="m.role === 'user'
                        ? 'bg-indigo-600 text-white whitespace-pre-wrap'
                        : 'bg-gray-700 text-gray-100 chat-markdown'"
                 x-html="m.role === 'user' ? escapeHtml(m.text) : renderMarkdown(m.text)"></div>
          </div>

          <!-- Tool cards -->
          <template x-for="(c, j) in m.cards" :key="j">
            <div class="mt-2 rounded-lg border border-gray-700 bg-gray-900 overflow-hidden text-sm">
              <button @click="c.open = !c.open"
                      class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-gray-750">
                <span x-text="c.phase === 'start' ? '⚙️' : (c.ok ? '✅' : '⚠️')"></span>
                <span class="font-mono text-indigo-300" x-text="c.name"></span>
                <span class="text-gray-400 truncate flex-1" x-text="c.summary"></span>
                <span class="text-gray-500 text-xs" x-text="c.open ? '▾' : '▸'"></span>
              </button>
              <div x-show="c.open" x-cloak class="border-t border-gray-700 px-3 py-2">
                <pre class="text-xs text-gray-300 overflow-x-auto whitespace-pre-wrap"
                     x-text="c.detail"></pre>
              </div>
            </div>
          </template>
        </div>
      </template>

      <div x-show="streaming" x-cloak class="text-gray-400 text-sm px-1">
        <span class="animate-pulse">thinking…</span>
      </div>
    </div>

    <div class="border-t border-gray-700 p-3">
      <form @submit.prevent="send()" class="flex gap-2">
        <input x-model="input" :disabled="streaming"
               maxlength="2000"
               placeholder="Ask about your library, diagnose a failed download…"
               class="flex-1 rounded-lg bg-gray-900 border border-gray-700 px-4 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500">
        <button type="submit" :disabled="streaming || !input.trim()"
                class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium transition-colors">
          Send
        </button>
      </form>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
// Answers arrive as markdown: tables of episodes, release lists, bold verdicts. Rendering it
// as plain text is what made a good answer look like noise. Model and tool output are
// untrusted, so everything goes through the sanitizer before it reaches the DOM.
// Sizes and counts get written as "~768 GB". GFM reads a second tilde on the line as the
// close of a strikethrough and crosses out everything between them, so that rule is off:
// tilde-as-approximately is far more common here than deliberate strikethrough.
let markedReady = false;
function renderMarkdown(text) {
  if (!text) return '';
  if (!window.marked || !window.DOMPurify) return escapeHtml(text);
  if (!markedReady) {
    marked.use({ tokenizer: { del: () => undefined } });
    markedReady = true;
  }
  return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function chat() {
  return {
    threadId: {{ (thread.id if thread else None) | tojson }},
    threads: {{ threads | tojson }},
    messages: {{ messages | tojson }},
    input: '',
    streaming: false,

    init() {
      // Opening a thread should land on the latest turn, not the top of the transcript.
      this.scrollDown();
    },

    scrollDown() {
      this.$nextTick(() => {
        const el = document.getElementById('chat-scroll');
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    newThread() {
      fetch('/web/chat/thread', { method: 'POST' })
        .then(r => r.json())
        .then(d => { window.location.href = '/web/chat/' + d.thread_id; });
    },

    deleteThread(id) {
      fetch('/web/chat/thread/' + id + '/delete', { method: 'POST' })
        .then(() => {
          this.threads = this.threads.filter(t => t.id !== id);
          if (id === this.threadId) window.location.href = '/web/chat';
        });
    },

    send() {
      const text = this.input.trim();
      if (!text || this.streaming) return;
      this.input = '';
      this.messages.push({ role: 'user', text: text, cards: [] });
      const assistant = { role: 'assistant', text: '', cards: [] };
      this.streaming = true;
      this.scrollDown();

      fetch('/web/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_id: this.threadId, message: text }),
      }).then(response => {
        if (!response.ok || !response.body) {
          throw new Error('stream failed: HTTP ' + response.status);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let started = false;

        const pump = () => reader.read().then(({ done, value }) => {
          if (done) { this.streaming = false; return; }
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const frame = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            const ev = parseSSE(frame);
            if (!ev) continue;

            if (ev.event === 'meta') {
              this.threadId = ev.data.thread_id;
              if (!this.threads.some(t => t.id === this.threadId)) {
                this.threads.unshift({ id: this.threadId, title: text.slice(0, 60) });
              }
            } else if (ev.event === 'delta') {
              if (!started) { this.messages.push(assistant); started = true; }
              assistant.text += ev.data.text;
              this.scrollDown();
            } else if (ev.event === 'tool') {
              if (!started) { this.messages.push(assistant); started = true; }
              if (ev.data.phase === 'start') {
                assistant.cards.push({
                  name: ev.data.name, phase: 'start', ok: true, open: false,
                  summary: summarizeArgs(ev.data.args),
                  detail: 'args:\n' + pretty(ev.data.args),
                });
              } else {
                let card = assistant.cards.find(c => c.name === ev.data.name && c.phase === 'start');
                if (!card) {
                  card = { name: ev.data.name, phase: 'end', ok: true, open: false, summary: '', detail: '' };
                  assistant.cards.push(card);
                }
                card.phase = 'end';
                card.ok = !/permission-denied|tool-failed|not-configured/.test(String(ev.data.result));
                card.summary = firstLine(ev.data.result);
                card.detail = (card.detail ? card.detail + '\n\n' : '') + 'result:\n' + ev.data.result;
              }
              this.scrollDown();
            } else if (ev.event === 'done') {
              if (!started) this.messages.push(assistant);
              this.streaming = false;
            } else if (ev.event === 'error') {
              if (!started) { this.messages.push(assistant); started = true; }
              assistant.text += (assistant.text ? '\n\n' : '') +
                '⚠️ ' + ev.data.message;
              this.streaming = false;
            }
          }
          this.scrollDown();
          return pump();
        });
        return pump();
      }).catch(err => {
        assistant.text += (assistant.text ? '\n\n' : '') + '⚠️ ' + err;
        this.streaming = false;
      });
    },
  };
}

function parseSSE(frame) {
  let event = 'message';
  let data = '';
  for (const line of frame.split('\n')) {
    if (line.startsWith('event: ')) event = line.slice(7).trim();
    else if (line.startsWith('data: ')) data += line.slice(6);
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; }
  catch { return { event, data: { raw: data } }; }
}

function pretty(v) {
  if (typeof v === 'string') { try { v = JSON.parse(v); } catch {} }
  try { return JSON.stringify(v, null, 2); } catch { return String(v); }
}

function summarizeArgs(v) {
  const s = typeof v === 'string' ? v : JSON.stringify(v);
  return String(s).slice(0, 80);
}

function firstLine(v) {
  const s = String(v).replace(/\s+/g, ' ').trim();
  return s.slice(0, 100);
}
</script>
{% endblock %}
